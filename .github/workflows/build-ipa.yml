name: Build OurMoney IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate app icon
        run: python3 tools/generate_icon.py

      - name: Create missing Plist
        run: cp OurMoney/Resources/GoogleService-Info.plist.example OurMoney/Resources/GoogleService-Info.plist

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate
          grep "objectVersion" OurMoney.xcodeproj/project.pbxproj
          sed -i '' -E 's/objectVersion = [0-9]+;/objectVersion = 56;/g' OurMoney.xcodeproj/project.pbxproj
          grep "objectVersion" OurMoney.xcodeproj/project.pbxproj

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build device app (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project OurMoney.xcodeproj \
            -scheme OurMoney \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath derived_data \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            > build-log.txt 2>&1 || true
            
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add build-log.txt
          git commit -m "Upload build log from action" || true
          git push || true

      - name: Package unsigned IPA
        run: |
          mkdir -p build/Payload
          find derived_data -name "OurMoney.app" > post-build-log.txt 2>&1
          cp -R derived_data/Build/Products/Release-iphoneos/OurMoney.app build/Payload/ >> post-build-log.txt 2>&1 || true
          cd build
          zip -qry OurMoney.ipa Payload >> ../post-build-log.txt 2>&1 || true
          ls -la OurMoney.ipa >> ../post-build-log.txt 2>&1 || true
          unzip -l OurMoney.ipa | head -20 >> ../post-build-log.txt 2>&1 || true

      - name: Verify IPA structure
        working-directory: build
        run: |
          test -f Payload/OurMoney.app/OurMoney || (echo "Binary missing" >> ../post-build-log.txt)
          test -f Payload/OurMoney.app/Info.plist || (echo "Info.plist missing" >> ../post-build-log.txt)
          file Payload/OurMoney.app/OurMoney >> ../post-build-log.txt 2>&1 || true
          file Payload/OurMoney.app/OurMoney | grep -q arm64 || (echo "Not an arm64 device binary" >> ../post-build-log.txt)
          echo "IPA structure verified" >> ../post-build-log.txt

      - name: Upload IPA to BashUpload
        run: |
          curl -T build/OurMoney.ipa bashupload.com > ipa-link.txt
          cat ipa-link.txt >> post-build-log.txt
          git add post-build-log.txt ipa-link.txt
          git commit -m "Upload IPA link and post-build log" || true
          git push || true

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: OurMoney-unsigned-ipa
          path: build/OurMoney.ipa
          if-no-files-found: error
