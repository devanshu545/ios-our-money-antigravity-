name: Build OurMoney IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate app icon
        run: python3 tools/generate_icon.py

      - name: Create missing Plist
        run: cp OurMoney/Resources/GoogleService-Info.plist.example OurMoney/Resources/GoogleService-Info.plist

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build device app (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project OurMoney.xcodeproj \
            -scheme OurMoney \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath derived_data \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            > build-log.txt 2>&1 || true
            
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add build-log.txt
          git commit -m "Upload build log from action" || true
          git push || true

      - name: Package unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -R derived_data/Build/Products/Release-iphoneos/OurMoney.app build/Payload/
          cd build
          zip -qry OurMoney.ipa Payload
          ls -la OurMoney.ipa
          unzip -l OurMoney.ipa | head -20

      - name: Verify IPA structure
        working-directory: build
        run: |
          test -f Payload/OurMoney.app/OurMoney || (echo "Binary missing" && exit 1)
          test -f Payload/OurMoney.app/Info.plist || (echo "Info.plist missing" && exit 1)
          file Payload/OurMoney.app/OurMoney | grep -q arm64 || (echo "Not an arm64 device binary" && exit 1)
          echo "IPA structure verified"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: OurMoney-unsigned-ipa
          path: build/OurMoney.ipa
          if-no-files-found: error
